<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="" method="" autocomplete="on">
        <label for="fullname">Full Name:</label>
        <input type="text" id="fullname" name="fullname" maxlength="20">
        <br><br>
        <label for="lastname">Last Name:</label>
        <input type="text" id="lastname" name="lastname" maxlength="20">
        <br><br>
        <label for="dateofbirth">Date of Birth:</label>
        <input type="date" id="dateofbirth" name="dateofbirth">
        <br><br>
        <label for="gender">Gender:</label>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>
        <br><br>
        <label for="email">Email id:</label>
        <input type="email" id="email" name="email">
        <br><br>
        <label for="mobile">Mobile Number:</label>
        <input type="tel" id="mobile" name="mobile" pattern="[0-9]{10}">
        <br><br>
        <label for="address">Address:</label>
        <textarea id="address" name="address" > </textarea>
        <label for="city">City:</label>
        <input type="text" id="city" name="city">
        <label for="pincode">Pincode:</label>
        <input type="text" id="pincode" name="pincode" maxlength="6">
        <br><br>
        <label for="email">Email id:</label>
        <input type="email" id="email" name="email">
        <br><br>
        <label for="state">State:</label>
        <input type="text" id="state" name="state">
        <br><br>
        <label for="country">Country:</label>
        <input type="text" id="country" name="country">
        <br><br>
        <label for="hobbies">Hobbies:</label>
        <input type="checkbox" id="hobby1" name="hobbies" value="drawing">
        <label for="hobby1">drawing</label>
        <input type="checkbox" id="hobby2" name="hobbies" value="singing">
        <label for="hobby2">singing</label>
        <input type="checkbox" id="hobby3" name="hobbies" value="dancing">
        <label for="hobby3">dancing</label>
        <input type="checkbox" id="hobby4" name="hobbies" value="other">
        <label for="hobby4">other</label>
        <input type="text" id="otherhobby" name="otherhobby">
        <br><br>
        <label for="qualification">Qualification:</label>
        <table>
            <tr>
                <th>sl no </th>
                <th>Examination</th>
                <th>Board</th>
                <th>Percentage</th>
                <th>Year of Passing</th>
            </tr>
            <td>1</td>
            <td><input type="text" id="examination1" name="examination1"></td>
            <td><input type="text" id="board1" name="board1"></td>
            <td><input type="text" id="percentage1" name="percentage1"></td>
            <td><input type="text" id="yearofpassing1" name="yearofpassing1"></td>
            </tr>
            <tr>
                <td>2</td>
                <td><input type="text" id="examination2" name="examination2"></td>
                <td><input type="text" id="board2" name="board2"></td>
                <td><input type="text" id="percentage2" name="percentage2"></td>
                <td><input type="text" id="yearofpassing2" name="yearofpassing2"></td>
            </tr>
            <tr>
                <td>3</td>
                <td><input type="text" id="examination3" name="examination3"></td>
                <td><input type="text" id="board3" name="board3"></td>
                <td><input type="text" id="percentage3" name="percentage3"></td>
                <td><input type="text" id="yearofpassing3" name="yearofpassing3"></td>
            </tr>
            <tr>
                <td>4</td>
                <td><input type="text" id="examination4" name="examination4"></td>
                <td><input type="text" id="board4" name="board4"></td>
                <td><input type="text" id="percentage4" name="percentage4"></td>
                <td><input type="text" id="yearofpassing4" name="yearofpassing4"></td>
            </tr>
            
        </table>

        <label for="course applied">Course Applied for:</label>
        <input type="checkbox" id="course1" name="course" value="BCA">
        <label for="course1">BCA</label>
        <input type="checkbox" id="course2" name="course" value="Bcom">
        <label for="course2">Bcom</label>
        <input type="checkbox" id="course3" name="course" value="Bsc">
        <label for="course3">Bsc</label>
        <input type="checkbox" id="course4" name="course" value="BA">
        <label for="course4">BA</label>

        <br><br>

        <input type="submit" align="center" value="submit">
        <input type="reset" align="center" value="reset">
        
    </form>

</body>
</html>
