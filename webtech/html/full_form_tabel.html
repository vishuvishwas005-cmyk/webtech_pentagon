<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <form>
        <table>
            <tr>
                <td>
                    <label for="fname">FullName</label>
                </td>
                
                <td>
                    <input type="text" id="fname" name="fname" maxlength="20">
                </td>
            </tr>
            
            <tr>
                <td>
                    <label for="lname">Lastname</label>
                </td>
                <td>
                    <input type="text" id="lname" name="lname" maxlength="20">
                </td>
            </tr>
            
            <tr>
                <td>
                    <label for="day">Date of Birth</label>
                </td>
                <td>
                    <input type="date" id="day" name="day">
                </td>
            </tr>
            
            <tr>
                <td>
                    <label>GENDER</label>
                </td>
                <td>
                    <input type="radio" id="male" name="gender" value="male"> <label for="male">male</label>
                    <input type="radio" id="female" name="gender" value="female"> <label for="female">female</label>
                </td>
            </tr>
            
            <tr>
                <td>
                    <label for="email">EMAIL ID</label>
                </td>
                <td>
                    <input type="email" id="email" name="email">
                </td>
            </tr>
            
            <tr>
                <td>
                    <label for="mobile">MOBILE NO</label>
                </td>
                <td>
                    <input type="text" id="mobile" name="mobile" maxlength="10">
                </td>
            </tr>
            
            <tr>
                <td>
                    <label for="address">ADDRESS</label>
                </td>
                <td>
                    <textarea id="address" name="address" rows="6" cols="25"></textarea>
                </td>
            </tr>
            
            <tr>
                <td>
                    <label for="city">CITY</label>
                </td>
                <td>
                    <input type="text" id="city" name="city">
                </td>
            </tr>
            
            <tr>
                <td>
                    <label for="pincode">PINCODE</label>
                </td>
                <td>
                    <input type="text" id="pincode" name="pincode" maxlength="6"> (6 digit number)
                </td>
            </tr>
            
            <tr>
                <td>
                    <label for="email2">EMAIL ID</label>
                </td>
                <td>
                    <input type="email" id="email2" name="email2">
                </td>
            </tr>
            
            <tr>
                <td>
                    <label for="state">STATE</label>
                </td>
                <td>
                    <input type="text" id="state" name="state">
                </td>
            </tr>
            
            <tr>
                <td>
                    <label for="country">COUNTRY</label>
                </td>
                <td>
                    <input type="text" id="country" name="country">
                </td>
            </tr>
            
            <tr>
                <td>
                    <label>HOBBIES</label>
                </td>
                <td>
                    <input type="checkbox" id="drawing" name="hobby" value="Drawing"> <label for="drawing">Drawing</label>
                    <input type="checkbox" id="singing" name="hobby" value="Singing"> <label for="singing">Singing</label>
                    <input type="checkbox" id="dancing" name="hobby" value="Dancing"> <label for="dancing">Dancing</label>
                    <br>
                    <input type="checkbox" id="other" name="hobby" value="Other"> <label for="other">Other</label>
                    <input type="text" name="otherhobby">
                </td>
            </tr>
            
            <tr>
                <td>
                    <label>Qualification</label>
                </td>
                <td>
                    <table>
                        <tr>
                            <td>sl.no</td>
                            
                            <td>Examination</td>
                            <td>Board</td>
                            <td>Percentage</td>
                            <td>Year of pass</td>
                        </tr>
                        <tr>
                            <td>01</td>
                            <td><input type="text"></td>
                            <td><input type="text"></td>
                            <td><input type="text"></td>
                            <td><input type="text"></td>
                        </tr>
                        <tr>
                            <td>02</td>
                            <td><input type="text"></td>
                            <td><input type="text"></td>
                            <td><input type="text"></td>
                        </tr>
                        <tr>
                            <td>03</td>
                            <td><input type="text"></td>
                            <td><input type="text"></td>
                            <td><input type="text"></td>
                            <td><input type="text"></td>
                        </tr>
                        <tr>
                            <td>04</td>
                            <td><input type="text"></td>
                            <td><input type="text"></td>
                            <td><input type="text"></td>
                            <td><input type="text"></td>
                        </tr>
                    </tr>
                </table>
            </td>
        </tr>
        
        <tr>
            <td>
                <label>COURSES APPLIED FOR</label>
            </td>
            
            <td>
                <input type="checkbox" id="bca" name="course" value="BCA"> <label for="bca">BCA</label>
                <input type="checkbox" id="bcom" name="course" value="B.com"> <label for="bcom">B.com</label>
                <input type="checkbox" id="bsc" name="course" value="B.sc"> <label for="bsc">B.sc</label>
                <input type="checkbox" id="ba" name="course" value="B.A"> <label for="ba">B.A</label>
                
                <td colspan="2" align="center">
                    <input type="submit" value="submit">
                    <input type="reset" value="reset">
                </td>
            </tr>
        </table>
    </form>

</body>
</html>
